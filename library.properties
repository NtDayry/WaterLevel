paragraph=Comprehensive driver and helper library for the Waveshare ESP32-S3-Touch-LCD-4.3B development board. Includes support for industrial RS485 (Hardware UART with auto direction), CAN Bus (TWAI controller with TJA1051T transceiver), I2C bus manager with auto-scanner, and onboard CH422G IO expander (backlight, touch reset, LCD reset, and isolated digital IOs).
